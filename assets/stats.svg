<svg xmlns="http://www.w3.org/2000/svg" width="560" height="170" viewBox="0 0 560 170" role="img" aria-label="3 IEEE papers, 4 first-place wins">
<style>
  .num { font-family:'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Tamil Sangam MN', 'Noto Sans Tamil', sans-serif; font-size:52px; font-weight:800; text-anchor:middle; }
  .lab { font-family:'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Tamil Sangam MN', 'Noto Sans Tamil', sans-serif; font-size:13px; font-weight:600; letter-spacing:2.5px; fill:#d7d3ff; text-anchor:middle; }
  .card { animation:in 1s ease-out both, bob 4s ease-in-out 1s infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes in { from { opacity:0; transform:translateY(20px) scale(.95); } to { opacity:1; transform:none; } }
  @keyframes bob { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-5px); } }
  .run { animation:run 3s linear infinite; }
  @keyframes run { to { stroke-dashoffset:-730; } }
</style>
<g class="card" style="animation-delay:0.0s">
<rect x="25.0" y="25" width="245" height="120" rx="16" fill="#141a3a" stroke="#36d1dc" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="25.0" y="25" width="245" height="120" rx="16" fill="none" stroke="#36d1dc" stroke-width="2.5" stroke-dasharray="80 650" class="run" style="animation-delay:0.0s"/>
<text x="147.5" y="95" class="num" fill="#36d1dc">3</text>
<text x="147.5" y="125" class="lab">IEEE PAPERS</text></g><g class="card" style="animation-delay:0.25s">
<rect x="290.0" y="25" width="245" height="120" rx="16" fill="#141a3a" stroke="#ff6ec7" stroke-opacity=".55" stroke-width="1.5"/>
<rect x="290.0" y="25" width="245" height="120" rx="16" fill="none" stroke="#ff6ec7" stroke-width="2.5" stroke-dasharray="80 650" class="run" style="animation-delay:0.25s"/>
<text x="412.5" y="95" class="num" fill="#ff6ec7">4×</text>
<text x="412.5" y="125" class="lab">FIRST-PLACE WINS</text></g>
</svg>
