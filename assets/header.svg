<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Ashvitta S — Computer Vision and AI Researcher">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0b1026"/>
    <stop offset="50%" stop-color="#1a1145">
      <animate attributeName="stop-color" values="#1a1145;#0f2a4a;#2a0f45;#1a1145" dur="12s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#2b0b3a"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#ff6ec7"/>
    <stop offset="50%" stop-color="#7f5cff"/>
    <stop offset="100%" stop-color="#36d1dc"/>
    <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;1 0;-1 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="glow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#7f5cff" stop-opacity="0.45"/>
    <stop offset="100%" stop-color="#7f5cff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="spread" spreadMethod="reflect" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff6ec7"/><stop offset="1" stop-color="#36d1dc"/>
  </linearGradient>
</defs>
<style>
  .t { opacity:0; animation-name:lock; animation-iteration-count:infinite; animation-timing-function:ease-out; transform-box:fill-box; transform-origin:center; }
  @keyframes lock { 0% { opacity:0; transform:scale(1.35); } 20% { opacity:.85; transform:scale(1); } 70% { opacity:.6; transform:scale(1); } 100% { opacity:0; transform:scale(1); } }
  .cf { font-family:'Consolas','Courier New',monospace; font-size:10px; font-weight:700; fill:#0b1026; }
  .scan { animation:scan 7s linear infinite; }
  @keyframes scan { from { transform:translateX(-10px); } to { transform:translateX(1210px); } }
  .name { font-family:'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Tamil Sangam MN', 'Noto Sans Tamil', sans-serif; font-weight:800; font-size:76px; letter-spacing:4px; animation:rise 1.4s ease-out both; }
  .sub  { font-family:'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Tamil Sangam MN', 'Noto Sans Tamil', sans-serif; font-size:22px; fill:#d7d3ff; letter-spacing:3px; animation:rise 1.4s .4s ease-out both; }
  .tam  { font-family:'Segoe UI', 'Helvetica Neue', Arial, 'Nirmala UI', 'Tamil Sangam MN', 'Noto Sans Tamil', sans-serif; font-size:18px; fill:#8fe9f0; letter-spacing:2px; animation:rise 1.4s .8s ease-out both; }
  @keyframes rise { from { opacity:0; transform:translateY(18px); } to { opacity:1; transform:translateY(0); } }
  .ring { fill:none; stroke:url(#spread); stroke-width:1.5; stroke-dasharray:6 10; transform-origin:600px 160px; animation:spin 30s linear infinite; opacity:.5; }
  .ring2 { animation-direction:reverse; animation-duration:45s; opacity:.3; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .bar { animation:sweep 4s ease-in-out infinite; transform-origin:600px 0; }
  @keyframes sweep { 0%,100% { transform:scaleX(.2); } 50% { transform:scaleX(1); } }
</style>
